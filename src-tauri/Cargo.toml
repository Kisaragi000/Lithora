[package]
name = "lithora"
version = "0.5.2"
description = "Lithora, a multilingual Word and RTF editor"
authors = ["Kisaragi and the Lithora contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kisaragi000/Lithora"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lithora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Lithora's document engine: WordCraft's Rust crates (MIT OR Apache-2.0),
# https://github.com/storytold/wordcraft. Pinned to a reviewed commit.
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
sys-locale = "0.3"
tauri-plugin-clipboard-manager = "2"
# Paste reads formatted text and pictures from the clipboard (the plugin reads only text).
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
semver = "1"
# Printing: sends a print-ready PDF to the system spooler (CUPS on Linux, the Windows print
# API on Windows). From WordCraft's craft-libs (MIT OR Apache-2.0), same pin as krilla below.
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }
base64 = "0.22"
sha2 = "0.10"
# Checks the signature on update checksum lists.
ed25519-dalek = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# English grammar and style checking for Proofread (Apache-2.0), https://github.com/Automattic/harper
harper-core = "2.13"
# The English thesaurus Harper ships (Apache-2.0), for Review › Thesaurus.
harper-thesaurus = "2.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# WordCraft's PDF writer needs this build of krilla (same pin as WordCraft's own workspace).
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }

# Optimize dependencies in debug builds too: page layout is slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

# Lithora's copy of WordCraft's file import/export, with fixes (see vendor/wordcraft-formats).
[patch."https://github.com/storytold/wordcraft"]
wordcraft-formats = { path = "vendor/wordcraft-formats" }
# Lithora's copy of WordCraft's proofing, with Armenian spelling (see vendor/wordcraft-proof).
wordcraft-proof = { path = "vendor/wordcraft-proof" }
