# Lithora's copy of WordCraft's layout crate (MIT OR Apache-2.0,
# https://github.com/storytold/wordcraft, commit 00bc6a4), with a line-breaking fix.
# See README.md in this folder.
[package]
name = "wordcraft-layout"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WordCraft layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[dependencies]
wordcraft-geom = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-proof = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-metafile = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
kurbo = { version = "0.13", features = ["serde"] }
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
log = "0.4"
