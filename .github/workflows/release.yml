name: Release

# Every merge to main that carries a new version number (package.json)
# builds the Windows and Linux installers and publishes them as a GitHub
# release, which the in-app "Check for updates" button then offers.
# Merges that keep the version of an already published release do nothing.
# It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = "false" ]; then
            echo "$tag is already published; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: Lithora ${{ needs.check.outputs.tag }}
          releaseBody: |
            Download the installer for your system below.
            Windows: Lithora_*_x64-setup.exe. Linux: the .deb (Ubuntu, Debian, Mint), the .rpm (Fedora, openSUSE) or the .AppImage (any distribution). Nothing else needs to be installed.
          # Stays a draft until both installers are attached; the publish job
          # below makes it public.
          releaseDraft: true
          prerelease: false

      # Lithora's "Check for updates" compares its download against these.
      - name: Attach checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle
          name="SHA256SUMS-${{ runner.os }}.txt"
          find . -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 \
            | xargs -0 sha256sum | sed -E 's#^([0-9a-f]+) [ *]\./(.*/)?#\1  #' > "$name"
          cat "$name"
          gh release upload "${{ needs.check.outputs.tag }}" "$name" --clobber --repo "${{ github.repository }}"

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.check.outputs.tag }}" --draft=false --latest --repo "${{ github.repository }}"
